<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract blue architectural forms</title>
  <desc id="desc">Layered blue planes and fine grid lines on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b36"/>
      <stop offset="1" stop-color="#284d7a"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7898c8"/>
      <stop offset="1" stop-color="#d5e3f5"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#d9e7fa" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 665 770 225l830 310v365H0Z" fill="#172946" opacity=".72"/>
  <path d="m190 695 610-350 610 228-610 94Z" fill="url(#plane)"/>
  <path d="m190 695 610-28v170l-610-48Z" fill="#426895"/>
  <path d="m800 667 610-94v144l-610 120Z" fill="#1e3b63"/>
  <circle cx="1280" cy="205" r="74" fill="#b9d4f2" opacity=".9"/>
  <path d="M80 110h345M80 145h225" stroke="#e6f1ff" stroke-width="5" opacity=".65"/>
</svg>
