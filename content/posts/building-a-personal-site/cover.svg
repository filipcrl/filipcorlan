<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract personal website layout</title>
  <desc id="desc">Warm geometric panels arranged like a website on a dark background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241914"/>
      <stop offset="1" stop-color="#6f3e2b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d8b5"/>
      <stop offset="1" stop-color="#d99061"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#130b08" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="310" fill="#bb6947" opacity=".3"/>
  <circle cx="130" cy="850" r="360" fill="#d49b65" opacity=".14"/>
  <g filter="url(#shadow)">
    <rect x="250" y="145" width="1100" height="610" rx="16" fill="#f7eee3"/>
    <rect x="250" y="145" width="1100" height="78" rx="16" fill="#33231d"/>
    <circle cx="300" cy="184" r="9" fill="#dc7c59"/>
    <circle cx="333" cy="184" r="9" fill="#e5b064"/>
    <circle cx="366" cy="184" r="9" fill="#829a70"/>
    <rect x="320" y="290" width="370" height="44" rx="7" fill="#382720"/>
    <rect x="320" y="360" width="470" height="16" rx="8" fill="#aa978a"/>
    <rect x="320" y="395" width="410" height="16" rx="8" fill="#c2b1a6"/>
    <rect x="320" y="430" width="445" height="16" rx="8" fill="#c2b1a6"/>
    <rect x="880" y="285" width="370" height="300" rx="10" fill="url(#card)"/>
    <path d="m925 510 92-108 66 72 54-53 74 89Z" fill="#6e4433" opacity=".72"/>
    <circle cx="1158" cy="355" r="37" fill="#fff0cf" opacity=".8"/>
    <rect x="320" y="535" width="180" height="54" rx="27" fill="#a44f32"/>
  </g>
</svg>
